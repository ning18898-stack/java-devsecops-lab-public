name: Licensed custom CodeQL
on:
  workflow_dispatch:
    inputs:
      license_basis:
        description: 'Owner-reviewed license basis; configure CODEQL_LICENSE_BASIS after eligibility review'
        required: true
        type: choice
        options: [unconfirmed, open-source, code-security]
        default: unconfirmed
permissions:
  contents: read
concurrency:
  group: licensed-codeql-${{ github.ref }}
  cancel-in-progress: false
jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require explicit owner-reviewed eligibility
        env:
          BASIS: ${{ inputs.license_basis }}
          REVIEWED_BASIS: ${{ vars.CODEQL_LICENSE_BASIS }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$BASIS" = "unconfirmed" ] || [ "$BASIS" != "$REVIEWED_BASIS" ]; then
            echo 'BLOCKED: CodeQL hosted license basis has not been reviewed.'
            exit 1
          fi
          if [ "$BASIS" = "open-source" ] && [ "$PRIVATE" != "false" ]; then
            echo 'BLOCKED: private repository cannot use the open-source basis.'
            exit 1
          fi
  analyze:
    needs: eligibility
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.9'
      - name: Download checksum-locked Temurin 17.0.20.1+1
        id: jdk
        run: python scripts/phase6/bootstrap.py jdk-archive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: jdkfile
          java-version: '17.0.20' # SemVer cache label; archive fixes the actual runtime.
          jdk-file: ${{ steps.jdk.outputs.archive }}
          cache: maven
          cache-dependency-path: 'apps/*/pom.xml'
      - name: Install checksum-locked official CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          Invoke-WebRequest https://github.com/github/codeql-cli-binaries/releases/download/v2.27.2/codeql-win64.zip -OutFile .tools/codeql-win64-2.27.2.zip
          $actual = (Get-FileHash .tools/codeql-win64-2.27.2.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne '6c90c8503af7b13827a151fbada959c1e5e4a49dd4ebad5bf0855f8a54404c1b') { throw 'CodeQL checksum mismatch' }
          Expand-Archive .tools/codeql-win64-2.27.2.zip -DestinationPath .tools/codeql-2.27.2
      - run: python scripts/phase6/ci.py codeql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codeql-reviewed-sarif
          path: artifacts/phase6-public/
          retention-days: 7
          if-no-files-found: error
